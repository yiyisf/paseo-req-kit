# Runs the checks the release workflow runs, on every push to main and on pull requests,
# so a problem shows up before a version tag is pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      # Failed tests as annotations: readable from the run page (and the API) without the full log.
      - name: Failed tests
        if: failure()
        shell: bash
        run: |
          grep -E "^not ok" test.log | sed 's/^/::error title=Linux::/' || true
          grep -E -A12 "^not ok" test.log | grep -E "error:|expected|actual" | head -40 | sed 's/^/::error title=Linux detail::/' || true
      - run: npm run typecheck
      - run: npm run eval:self-check
      - name: Package contents
        run: npm pack --dry-run
      - name: Install scripts
        shell: bash
        run: |
          set -o pipefail
          shellcheck -s sh -f gcc install.sh | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning|note): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'
          pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors); if ($errors) { $errors | ForEach-Object { Write-Host "::error file=install.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }; exit 1 }'

  # The Paseo plugin is compiled by Paseo with its own SDK; typecheck it against that SDK here.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paseo-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck

  # 1.13: most people run req-kit on Windows. For now this only reports (it does not block a
  # release): tests written for Linux (sh, symlinks, signals) are being made portable one by one.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
        shell: bash
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Failed tests
        if: always()
        shell: bash
        run: |
          grep -E "^not ok" test.log | sed 's/^/::warning title=Windows::/' || echo "所有测试都通过了"
          grep -E -A12 "^not ok" test.log | grep -E "error:|expected|actual|ENOENT|spawn" | head -60 | sed 's/^/::warning title=Windows detail::/' || true
      - name: Commands start on Windows
        if: always()
        shell: pwsh
        run: |
          node bin/req.mjs install --help
          node bin/req.mjs docs --help
          node bin/req.mjs ui-check --help

# Runs the checks the release workflow runs, on every push to main and on pull requests,
# so a problem shows up before a version tag is pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run eval:self-check
      - name: Package contents
        run: npm pack --dry-run

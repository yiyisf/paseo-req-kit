# Publishes req-kit to npm and creates the GitHub Release for a version tag (no "v" prefix,
# e.g. 1.7.0 or 1.7.0-beta.1).
#
# Tags come from either side:
# - pushed by a person (git push origin 1.8.0), or
# - made here: when main gets a package.json whose version has no tag yet, the "tag" job
#   tags that commit and the release follows in the same run. (A tag pushed with the
#   workflow's own token starts no other workflow, so both happen in this one file, which
#   is also the file npm trusted publishing is set up for.)
#
# Setup once (see docs/guide/维护者指南.md): on npmjs.com, add this repository and this workflow
# file as a trusted publisher of the package. No npm token is stored anywhere.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
    branches: [main]
    paths: ["package.json", ".github/workflows/release.yml"]
  # Re-run the release of an existing tag with this (current) workflow, e.g. from the
  # GitHub web page on a phone: Actions → release → Run workflow → tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. 1.7.0-beta.2"
        required: true

permissions:
  contents: write   # the tag, and the GitHub Release with the .tgz
  id-token: write   # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which tag to release; on a push to main, tags package.json's version when it is new.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
              echo "::notice::$VERSION is already tagged; nothing to release."
              echo "tag=" >> "$GITHUB_OUTPUT"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$VERSION" -m "req-kit $VERSION"
              git push origin "refs/tags/$VERSION"
              echo "::notice::Tagged $GITHUB_SHA as $VERSION."
              echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

  release:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci || npm install
      - name: Tag and package.json agree
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$TAG" || { echo "package.json is $VERSION, tag is $TAG"; exit 1; }
      - run: npm test
      - run: npm run typecheck
      - run: npm run eval:self-check
      # Trusted publishing (OIDC) needs the package to exist on npm. For the very first
      # publish, add an NPM_TOKEN secret (or publish the Release .tgz by hand once).
      # A version already on npm (a re-run) is skipped, so the Release can still be made.
      - name: Publish
        id: publish
        continue-on-error: true   # the Release with the .tgz is still made; the job fails at the end
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$TAG" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$TAG is already on npm; skipping publish."
            exit 0
          fi
          case "$TAG" in
            *-*) npm publish --tag beta ;;
            *)   npm publish ;;
          esac
      # Trusted publishing covers `npm publish` only; moving a dist-tag needs a token.
      # Optional: add an NPM_TOKEN secret (automation token) to set paseo-<minor> automatically.
      - name: Tag by supported Paseo version (releases only)
        if: ${{ !contains(env.TAG, '-') && steps.publish.outcome == 'success' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          MINOR=$(node -p "require('./package.json').reqKit.paseo.match(/>=?\s*(\d+\.\d+)/)[1]")
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: run 'npm dist-tag add paseo-req-kit@$TAG paseo-$MINOR' by hand."
          else
            npm dist-tag add "paseo-req-kit@$TAG" "paseo-$MINOR"
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const h='## '+process.env.TAG+'\n';const i=s.indexOf(h);const rest=i<0?'':s.slice(i+h.length);const j=rest.search(/^## /m);require('fs').writeFileSync(process.env.RUNNER_TEMP+'/notes.md',(j<0?rest:rest.slice(0,j)).trim()+'\n')"
      - name: Package for offline and internal registries
        run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: paseo-req-kit-*.tgz
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: ${{ runner.temp }}/notes.md
      - name: Publish to npm failed
        if: ${{ steps.publish.outcome == 'failure' }}
        run: |
          echo "::error::npm publish failed. The GitHub Release and its .tgz were created; install with npm i -g <the .tgz URL>. See docs/guide/维护者指南.md (npm 发布的一次性设置)."
          exit 1

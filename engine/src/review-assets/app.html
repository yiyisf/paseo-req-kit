<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>原型审查 · req-kit</title>
    <link rel="stylesheet" href="rk-tokens.css" />
    <link rel="stylesheet" href="rk.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="rk-icons.js"></script>
  </head>
  <body>
    <header class="rk-top">
      <span class="rk-brand"><svg data-logo style="--ground: var(--rk-surface-0)"></svg><span>req<i>-</i>kit</span></span>
      <span class="rk-top__sep rk-top__hide-sm"></span>
      <span class="rk-top__title" id="title">正在打开…</span>
      <span id="status" class="rk-badge rk-badge--muted" hidden></span>
      <span class="rk-top__spacer"></span>
      <button class="rk-btn rk-btn--ghost rk-btn--sm" type="button" data-rk-theme title="切换深浅色" aria-label="切换深浅色"><svg class="ic" data-i="sun"></svg></button>
    </header>

    <div class="ap-head">
      <span class="rk-eyebrow">Prototype review</span>
      <h1>在原型上点要改的地方，没问题就确认方案</h1>
      <p class="hint" id="hint"></p>
    </div>

    <main class="layout">
      <section class="stage" aria-label="原型">
        <div class="ap-bar">
          <div class="group" id="filesGroup" hidden><span class="label">页面</span><div class="seg rk-seg" id="files"></div></div>
          <div class="group" id="statesGroup" hidden><span class="label">状态</span><div class="seg rk-seg" id="states"></div></div>
          <div class="group"><span class="label">宽度</span><div class="seg rk-seg" id="widths"></div></div>
          <div class="group"><span class="label">操作</span><div class="seg rk-seg" id="modes"></div></div>
          <label class="check"><input type="checkbox" id="showRegions" checked /> 标出要看的地方</label>
          <label class="check" id="diffWrap" hidden><input type="checkbox" id="showDiff" /> 标出这一版改了哪里</label>
        </div>
        <div class="frame-wrap rk-dots" id="frameWrap">
          <div class="sizer" id="sizer"><iframe id="frame" title="界面原型"></iframe></div>
        </div>
        <div class="empty" id="empty" hidden></div>
      </section>

      <aside class="side">
        <details class="card" id="guide" open>
          <summary>怎么用</summary>
          <ol>
            <li>先看<span class="ap-key ap-key--region">虚线框</span>标出来的地方（①②③），它们是这次要改的，下面有对应的验收标准。</li>
            <li>想改哪里，就<strong>点哪里</strong>：选一种改法，再用自己的话补一句，不用专业词汇。</li>
            <li>想换文字，<strong>双击文字</strong>直接改成你想要的字。</li>
            <li>都看完了，在最下面提交修改意见；没有要改的，就确认方案、开始写代码。</li>
          </ol>
        </details>

        <section class="card">
          <h2><svg class="ic ic-sm" data-i="sparkles" style="color: var(--rk-ai)"></svg>要看的地方</h2>
          <ul class="list" id="regions"></ul>
        </section>

        <section class="card" id="changesCard" hidden>
          <h2><svg class="ic ic-sm" data-i="history"></svg>这一版的变化</h2>
          <div id="changes"></div>
        </section>

        <section class="card">
          <h2><svg class="ic ic-sm" data-i="message-square-plus" style="color: var(--rk-brand-text)"></svg>我的意见 <span class="count" id="count"></span></h2>
          <ul class="list" id="comments"></ul>
          <label class="field">
            <span>总体意见（可以不写）</span>
            <textarea id="general" rows="3" placeholder="例如：整体颜色太暗了，参考现在的订单列表页"></textarea>
          </label>
          <p class="muted small" id="saved"></p>
        </section>
      </aside>
    </main>

    <footer class="rk-decide" id="actions">
      <div class="rk-decide__in">
        <div class="rk-decide__sum"><b id="actionNote"></b><span id="result" class="result rk-cap" role="status" aria-live="polite"></span></div>
        <div class="rk-decide__acts">
          <button type="button" class="rk-btn" id="approve">确认方案，开始写代码</button>
          <button type="button" class="rk-btn rk-btn--primary" id="submitChanges">提交修改意见</button>
        </div>
      </div>
    </footer>

    <div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="popTitle" hidden>
      <p class="pop-title" id="popTitle"></p>
      <p class="pop-sub" id="popSub"></p>
      <div class="chips" id="kinds" role="radiogroup" aria-label="怎么改"></div>
      <label class="field" id="newTextField" hidden>
        <span id="newTextLabel">改成</span>
        <input type="text" id="newText" />
      </label>
      <label class="field">
        <span id="noteLabel">用你自己的话说说（可以不写）</span>
        <textarea id="note" rows="2"></textarea>
      </label>
      <div class="pop-actions">
        <button type="button" class="rk-btn rk-btn--ghost" id="popCancel">取消</button>
        <button type="button" class="rk-btn rk-btn--primary" id="popOk">添加</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
